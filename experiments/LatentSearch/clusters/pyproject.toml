[project]
name = "latentsearch-clusters"
version = "0.1.0"
description = "Reproduce the LLM-embedding nearest-neighbour clusters (pkl artifacts) used by the LatentSearch experiments. PyTorch-based, fully isolated from the AmpliGraph (TensorFlow) environment."
requires-python = "==3.10.*"
dependencies = [
    "torch==2.8.0",
    "transformers==4.56.0",
    "sentence-transformers==5.1.0",
    "numpy==2.2.6",
    "pandas==2.3.2",
    "scikit-learn==1.7.1",
    "scipy==1.15.3",
    "tqdm==4.67.1",
    "huggingface-hub==0.34.4",
    "xformers>=0.0.32.post2",
]

# NOTE: cache_datasets.py is intentionally NOT covered by this environment. It is the
# only script that needs AmpliGraph/TensorFlow and is meant to be run once in the main
# AmpliGraph environment to materialise the <dataset>/{train,valid,test}.txt splits.
# See README.md.
